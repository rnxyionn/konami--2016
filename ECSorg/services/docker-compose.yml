services:
  postgres:
    image: postgres:13.3
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-roblox}
      POSTGRES_USER: ${POSTGRES_USER:-roblox}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  migrate:
    build:
      context: .
      dockerfile: api/Dockerfile
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-roblox}
      DB_USER: ${POSTGRES_USER:-roblox}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    command: ["sh", "-c", "mkdir -p /app/public/images/groups /app/public/images/thumbnails /app/public/UnsecuredContent /app/public/img /app/storage/asset && npx knex migrate:latest"]
    volumes:
      - website-public:/app/public
      - website-storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  asset-validation:
    build:
      context: .
      dockerfile: AssetValidationServiceV2/Dockerfile
    ports:
      - "4300:4300"
    expose:
      - "4300"
    restart: unless-stopped

  website:
    build:
      context: .
      dockerfile: Roblox/Roblox.Website/Dockerfile
    ports:
      - "5000:5000"
    environment:
      ASPNETCORE_URLS: http://0.0.0.0:5000
      ASPNETCORE_ENVIRONMENT: Development
      Urls: http://0.0.0.0:5000
      Frontend__BaseUrl: ${FRONTEND_BASE_URL:-http://roblox.localhost:8080}
      Frontend__ProxyHost: frontend
      Postgres: Host=postgres;Database=${POSTGRES_DB:-roblox};Username=${POSTGRES_USER:-roblox};Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env};Maximum Pool Size=20
      Redis: redis:6379
      BaseUrl: http://api.roblox.localhost:8080
      Cors__AllowedOrigins__0: http://roblox.localhost:8080
      Development__AutoApproveApplications: ${LOCAL_AUTO_APPROVE_APPLICATIONS:-true}
      Development__AllowDirectSignup: ${LOCAL_DIRECT_SIGNUP:-true}
      AssetValidation__BaseUrl: http://asset-validation:4300
      AssetValidation__Authorization: ${ASSET_VALIDATION_AUTHORIZATION:-local-asset-token}
      Render__BaseUrl: ws://game-server:3189
      Render__Authorization: ${RENDER_AUTHORIZATION:-local-render-token}
      Directories__Storage: /data/storage/
      Directories__Asset: /data/storage/asset/
      Directories__Public: /data/public/
      Directories__Thumbnails: /data/public/images/thumbnails/
      Directories__GroupIcons: /data/public/images/groups/
      Directories__XmlTemplates: /app/templates/
      Directories__JsonData: /app/json/
      Directories__AdminBundle: /app/admin/
      Directories__EconomyChatBundle: /app/economy-chat/
      GameServerAuthorization: ${GAME_SERVER_AUTHORIZATION:-local-game-server-token}
      BotAuthorization: ${BOT_AUTHORIZATION:-local-bot-token}
      RccAuthorization: ${RCC_AUTHORIZATION:-local-rcc-token}
      OwnerUserId: ${OWNER_USER_ID:-1}
    volumes:
      - website-storage:/data/storage
      - website-public:/data/public
      - website-keys:/root/.aspnet/DataProtection-Keys
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      asset-validation:
        condition: service_started
      game-server:
        condition: service_started
      frontend:
        condition: service_started
    expose:
      - "5000"
    restart: unless-stopped

  game-server:
    build:
      context: ./game-server
      dockerfile: Dockerfile
    ports:
      - "3040:3040"
      - "3189:3189"
    environment:
      RENDER_AUTHORIZATION: ${RENDER_AUTHORIZATION:-local-render-token}
      WEBSITE_BASE_URL: http://website:5000
      WEBSITE_BOT_AUTH: ${BOT_AUTHORIZATION:-local-bot-token}
      GAME_SERVER_PORT: 3040
      THUMBNAIL_WEBSOCKET_PORT: 3189
      RCC_PORT: 64989
    volumes:
      - ./RCCService:/opt/rcc
    expose:
      - "3040"
      - "3189"
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: 2016-roblox-main/Dockerfile
      args:
        INTERNAL_API_BASE_URL: http://website:5000
    ports:
      - "3000:3000"
    expose:
      - "3000"
    restart: unless-stopped

  proxy:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - website
    restart: unless-stopped

volumes:
  postgres-data:
  website-storage:
  website-public:
  website-keys: