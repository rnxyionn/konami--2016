server {
    listen 80;
    server_name roblox.localhost;
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $frontend_upstream frontend:3000;
    set $website_upstream website:5000;

    location ~* ^/(apisite/|auth/|admin(/|$)|admin-api/|internal/|unsecuredcontent/|images/|comments/|asset/|develop/upload|game/|my/settings/|feeds/getuserfeed|thumbs/|userads/|user-sponsorship/|users/(inventory|favorites|profile)/|search/users/results|games/getgameinstancesjson|api/moderation/filtertext) {
        proxy_pass http://$website_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location / {
        proxy_pass http://$frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

server {
    listen 80;
    server_name api.roblox.localhost;
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $website_upstream website:5000;

    location / {
        proxy_pass http://$website_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}